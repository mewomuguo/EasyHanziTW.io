<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyTWHanzi</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/max32002/iansui/webfont/Iansui.css" />
  
  <style>
    :root {
      --bg: #fdfbf7;
      --card: #ffffff;
      --ink: #333333;
      --muted: #666666;
      --accent: #43aa8b;
      --accent-hover: #277da1;
      --accent2: #f9c74f;
      --wrong: #f94144;
      --ok: #90be6d;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iansui", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.5rem; color: var(--accent-hover); margin: 0; font-weight: normal; }
    
    .panel {
      background: var(--card);
      border: 4px solid var(--accent2);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 8px 0px var(--accent2);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .setting-group { margin-bottom: 1.5rem; }
    .setting-label { font-size: 1.3rem; font-weight: bold; color: var(--accent-hover); display: block; margin-bottom: 0.8rem; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.8rem; }
    
    .opt-btn {
      font: inherit; font-size: 1.2rem; font-weight: bold; border-radius: 12px;
      border: 3px solid var(--border); padding: 0.6rem 1.2rem; background: #fff;
      cursor: pointer; transition: all 0.2s; color: var(--muted);
    }
    .opt-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
      transform: translateY(-3px); box-shadow: 0 5px 0px #2d6a4f;
    }
    
    .btn-giant {
      font-size: 1.8rem; font-family: inherit; padding: 1rem 3rem; border-radius: 50px; border: none;
      background: #f94144; color: white; font-weight: bold; cursor: pointer;
      box-shadow: 0 6px 0px #c1121f; transition: all 0.1s;
    }
    .btn-giant:active { transform: translateY(6px); box-shadow: none; }

    /* 遊戲區樣式 */
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .timer-box { font-size: 1.8rem; font-weight: bold; color: var(--accent-hover); }
    .score { font-size: 1.5rem; font-weight: bold; color: var(--accent); }

    /* 時間進度條 */
    .progress-container {
      width: 100%; height: 12px; background-color: #eee;
      border-radius: 10px; overflow: hidden; margin-bottom: 1.5rem; border: 1px solid #ddd;
    }
    .progress-bar { height: 100%; background-color: var(--ok); width: 100%; transition: width 1s linear, background-color 0.3s; }
    .progress-bar.urgent { background-color: var(--wrong); }

    /* 直式注音排版 CSS */
    .word-container {
      display: inline-flex;
      flex-direction: row; 
      align-items: center;
      justify-content: center;
      margin: 1rem auto 2rem;
    }
    .base-char {
      font-size: 6rem;
      font-weight: bold;
      line-height: 1;
    }
    .zhuyin-col {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-weight: bold;
      line-height: 1.1;
      color: inherit;
    }
    #bigCharBox .zhuyin-col {
      margin-left: 0.8rem;
      color: #e76f51;
      font-size: 2.4rem;
    }
    .zy-chars {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      position: relative; 
    }
    .zy-neutral {
      margin-bottom: 0.1em; 
    }
    .zy-tone {
      position: absolute;
      left: 100%; 
      top: 50%;
      transform: translateY(-50%); 
      margin-left: 0.1em;
      font-size: 0.9em;
    }

    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .choices button {
      font-family: inherit; font-size: 1.8rem; padding: 1.2rem; border-radius: 16px;
      border: 4px solid var(--border); background: #fff; cursor: pointer;
      display: flex; justify-content: center; align-items: center; min-height: 100px;
    }
    .choices button.correct { border-color: var(--ok); background: #e8f5ef; color: #1b7f5a; }
    .choices button.incorrect { border-color: var(--wrong); background: #fce8ec; color: #9b2335; }
    .choices button .zhuyin-col { font-size: 1.8rem; }

    .result-score { font-size: 3rem; font-weight: bold; }
    .slowest-box { background: #fffdf5; border: 2px solid var(--border); border-radius: 16px; padding: 1.5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="langToggleBtn" class="opt-btn" style="position: absolute; top: 1rem; right: 1rem; padding: 0.5rem 1rem; font-size: 1rem;" onclick="toggleLang()">🌐 EN</button>
    <header><h1 data-i18n="title">✨ 認字挑戰 ✨</h1></header>

    <div id="setupPanel" class="panel">
      <input type="hidden" id="lv" value="1">
      <input type="hidden" id="mode" value="zhuyin">

      <div class="setting-group">

        <div class="btn-row">
          <button class="opt-btn active" onclick="setOpt('lv', '1', this)" data-i18n="lv1">LV1 基礎</button>
          <button class="opt-btn" onclick="setOpt('lv', '2', this)" data-i18n="lv2">LV2 初級</button>
          <button class="opt-btn" onclick="setOpt('lv', '3', this)" data-i18n="lv3">LV3 中級</button>
          <button class="opt-btn" onclick="setOpt('lv', '4', this)" data-i18n="lv4">LV4 進階</button>
          <button class="opt-btn" onclick="setOpt('lv', '5', this)" data-i18n="lv5">LV5 高級</button>
          <button class="opt-btn" onclick="setOpt('lv', '0', this)" data-i18n="lv0">全部混合</button>
        </div>
      </div>
      
      <div class="setting-group">
        <span class="setting-label"><span data-i18n="modeLabel">🎮 2. 選擇遊戲玩法：</span></span>
        <div class="btn-row">
          <button class="opt-btn active" onclick="setOpt('mode', 'zhuyin', this)" data-i18n="modeZhuyin">看字選注音</button>
          <button class="opt-btn" onclick="setOpt('mode', 'char', this)" data-i18n="modeChar">看注音選漢字</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label"><span data-i18n="timeLabel">⏱️ 3. 選擇挑戰時間：</span></span>
        <div class="btn-row">
          <button class="opt-btn active" onclick="selectTime(0, this)" data-i18n="unlimited">無限時</button>
          <button class="opt-btn" onclick="selectTime(60, this)" data-i18n="min1">1 分鐘</button>
          <button class="opt-btn" onclick="selectTime(180, this)" data-i18n="min3">3 分鐘</button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 2rem;">
        <button class="btn-giant" onclick="startGame()" data-i18n="startBtn">🚀 開始挑戰！</button>
      </div>
    </div>

    <div id="gamePanel" class="panel" hidden>
      <div class="game-header">
        <div class="score" id="scoreLine" data-i18n="scorePrefix">🏆 答對：0</div>
        <button class="opt-btn" onclick="pauseGame()" style="padding: 0.4rem 0.8rem; font-size: 1rem;" data-i18n="pauseBtn">⏸️ 暫停</button>
        <div class="timer-box" id="displayTimer" data-i18n="unlimited">無限時</div>
      </div>

      <div class="progress-container" id="progressContainer" hidden>
        <div class="progress-bar" id="progressBar"></div>
      </div>
      
      <div style="text-align: center;">
        <div id="bigCharBox" class="word-container">
          <div id="baseChar" class="base-char">—</div>
          <div id="rubyText" class="zhuyin-col"></div>
        </div>
      </div>
      
      <div class="choices" id="choices"></div>
    </div>

    <div id="pausePanel" class="panel" style="text-align: center;" hidden>
      <h2 style="color: var(--accent-hover); font-size: 2.5rem; margin-top: 1rem;" data-i18n="gamePaused">遊戲暫停</h2>
      <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <button class="btn-giant" style="background: var(--ok); box-shadow: 0 6px 0px #528a2a;" onclick="resumeGame()" data-i18n="resumeBtn">▶️ 繼續遊戲</button>
        <button class="btn-giant" onclick="endGame()" data-i18n="endEarlyBtn">🛑 提早結束</button>
      </div>
    </div>

    <div id="resultPanel" class="panel" style="text-align: center;" hidden>
      <h2 style="color: var(--accent-hover)" data-i18n="challengeEnd">挑戰結束！</h2>
      <div style="display: flex; justify-content: space-around; margin: 2rem 0;">
        <div><span id="lbl-correct" data-i18n="correctCnt">答對題數</span><div id="finalScore" class="result-score">0</div></div>
        <div><span id="lbl-accuracy" data-i18n="accuracy">準確率</span><div id="finalAccuracy" class="result-score" style="color: var(--ok)">0%</div></div>
      </div>
      <div class="slowest-box">
        <h3 style="text-align: left;" data-i18n="mistakesLabel">❌ 錯題本：</h3>
        <ul id="mistakeList" style="text-align: left; list-style: none; padding: 0;"></ul>
      </div>
      <div class="slowest-box" style="margin-top: 1rem;">
        <h3 style="text-align: left;" data-i18n="slowestLabel">🐢 最耗時的字 (前三名)：</h3>
        <ul id="slowestList" style="text-align: left; list-style: none; padding: 0;"></ul>
      </div>
      <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <button class="btn-giant" onclick="location.reload()" data-i18n="playAgain">🔄 再玩一次</button>
        <button class="btn-giant" style="background: var(--accent-hover); box-shadow: 0 6px 0px #1d5f7a;" onclick="exportTxt()" data-i18n="exportBtn">📄 輸出成績</button>
      </div>
    </div>
  </div>

    // 讀取 JSON 並自動套用字頻表分級
    let words = JSON.parse(document.getElementById('game-data').textContent).entries;

        w.lv = 5;

        // 依據字頻表位置均分為五個等級 (約 1146 字一級)

      }
    });

    let availableWords = [], currentWord = null;

    // 解析注音字串並轉換為自訂 HTML 結構
    function formatZhuyinHtml(z) {
      const tones = ['ˊ', 'ˇ', 'ˋ'];
      const neutral = '˙';
      let isNeutral = z.startsWith(neutral);
      let charsStr = isNeutral ? z.substring(1) : z;
      let tone = '';
      let lastChar = charsStr.slice(-1);
      
      if (tones.includes(lastChar)) {
        tone = lastChar;
        charsStr = charsStr.slice(0, -1);
      }
      
      let html = '';
      if (isNeutral) html += `<div class="zy-char zy-neutral">${neutral}</div>`;
      html += `<div class="zy-chars">`;
      for (let c of charsStr) html += `<div class="zy-char">${c}</div>`;
      if (tone) html += `<div class="zy-tone">${tone}</div>`;
      html += `</div>`;
      
      return html;
    }

    function setOpt(id, val, btn) {
      document.getElementById(id).value = val;
      btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function selectTime(sec, btn) {
      selectedSeconds = sec;
      isUnlimited = (sec === 0);
      btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function startGame() {
      const level = parseInt(document.getElementById('lv').value);
      
      // 依據選擇的等級過濾字庫 (累加制：LV3 包含 LV1~LV3)
      if (level === 0) {
        availableWords = [...words];
      } else {
        availableWords = words.filter(w => w.lv <= level);
      }

      if (availableWords.length === 0) {
        alert("此難度目前題庫尚無資料，請選擇其他難度或擴充字庫！");
        return;
      }

      document.getElementById('setupPanel').hidden = true;
      document.getElementById('gamePanel').hidden = false;
      document.getElementById('progressBar').classList.remove('urgent');
      
      score = 0; totalClicks = 0; gameActive = true;
      timeStats = [];
      isPaused = false;
      mistakeMap.clear();
      usedCharsInRound.clear(); // 清空出現過的字記錄
      timeLeft = selectedSeconds;
      
      if (!isUnlimited) {
        document.getElementById('progressContainer').hidden = false;
        startTimer();
      } else {
        document.getElementById('progressContainer').hidden = true;
        document.getElementById('displayTimer').textContent = "無限時";
      }
      loadQuestion();
    }

    function startTimer() {
      timer = setInterval(() => {
        timeLeft--;
        const display = document.getElementById('displayTimer');
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        display.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        
        const progress = (timeLeft / selectedSeconds) * 100;
        const progressBar = document.getElementById('progressBar');
        progressBar.style.width = progress + '%';

        if (timeLeft <= 10) progressBar.classList.add('urgent');
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function loadQuestion() {
      if (availableWords.length === 0) {
        endGame();
        return;
      }

      questionStartTime = Date.now();
      const mode = document.getElementById('mode').value;
      const randIdx = Math.floor(Math.random() * availableWords.length);
      currentWord = availableWords[randIdx];
      availableWords.splice(randIdx, 1); 

      // 紀錄為已出現
      usedCharsInRound.add(currentWord.c);

      const baseChar = document.getElementById('baseChar');
      const rubyText = document.getElementById('rubyText');
      const choices = document.getElementById('choices');
      
      baseChar.textContent = currentWord.c;
      rubyText.innerHTML = formatZhuyinHtml(currentWord.z);

      if (mode === 'zhuyin') {
        baseChar.style.visibility = 'visible';
        rubyText.style.visibility = 'hidden';
      } else {
        baseChar.style.visibility = 'hidden';
        rubyText.style.visibility = 'visible';
      }

      choices.innerHTML = '';
      let opts = [mode === 'zhuyin' ? currentWord.z : currentWord.c];
      
      // 產生隨機選項 (確保不跟已出現過的字重複)
      let attempts = 0;
      while (opts.length < 4 && attempts < 200) {
        attempts++;
        let r = words[Math.floor(Math.random() * words.length)];
        let val = mode === 'zhuyin' ? r.z : r.c;
        
        if (!opts.includes(val) && !usedCharsInRound.has(r.c)) {
          opts.push(val);
          usedCharsInRound.add(r.c); // 放入已出現名單
        }
      }

      // 避免因為字庫太小導致選項找不滿 4 個，進行放寬 (允許選項重複出現)
      if (opts.length < 4) {
        while (opts.length < 4) {
          let r = words[Math.floor(Math.random() * words.length)];
          let val = mode === 'zhuyin' ? r.z : r.c;
          if (!opts.includes(val)) opts.push(val);
        }
      }
      
      opts.sort(() => Math.random() - 0.5).forEach(o => {
        const b = document.createElement('button');
        if (mode === 'zhuyin') {
          b.innerHTML = `<div class="zhuyin-col">${formatZhuyinHtml(o)}</div>`;
        } else {
          b.textContent = o;
        }
        b.onclick = () => checkAnswer(o, b);
        choices.appendChild(b);
      });
    }

    function checkAnswer(o, b) {
      if (!gameActive) return;
      totalClicks++;
      const mode = document.getElementById('mode').value;
      const correct = mode === 'zhuyin' ? currentWord.z : currentWord.c;

      if (o === correct) {
        let timeTaken = Date.now() - questionStartTime;
        timeStats.push({ c: currentWord.c, time: timeTaken });

        if (mode === 'zhuyin') {
          document.getElementById('rubyText').style.visibility = 'visible';
        } else {
          document.getElementById('baseChar').style.visibility = 'visible';
        }

        b.classList.add('correct');
        score++;
        document.getElementById('scoreLine').textContent = `${t('scorePrefix')}${score}`;
        document.querySelectorAll('#choices button').forEach(btn => btn.disabled = true);
        setTimeout(loadQuestion, 800);
      } else {
        b.classList.add('incorrect');
        b.disabled = true;
        mistakeMap.set(currentWord.c, currentWord);
      }
    }

    function endGame() {
      if (!gameActive) return;
      gameActive = false;
      clearInterval(timer);
      
      document.getElementById('gamePanel').hidden = true;
      document.getElementById('pausePanel').hidden = true;
      document.getElementById('resultPanel').hidden = false;
      document.getElementById('finalScore').textContent = score;
      
      const accuracy = totalClicks === 0 ? 0 : Math.round((score / totalClicks) * 100);
      document.getElementById('finalAccuracy').textContent = accuracy + '%';
      
renderMistakes();

renderSlowest();
    }

    function pauseGame() {
      if (!gameActive) return;
      isPaused = true;
      clearInterval(timer);
      pauseTime = Date.now();
      document.getElementById('gamePanel').hidden = true;
      document.getElementById('pausePanel').hidden = false;
    }

    function resumeGame() {
      if (!gameActive) return;
      isPaused = false;
      questionStartTime += (Date.now() - pauseTime);
      document.getElementById('pausePanel').hidden = true;
      document.getElementById('gamePanel').hidden = false;
      if (!isUnlimited) startTimer();
    }

    function exportTxt() {
      let content = `${t('exportTitle')}\n`;
      content += `=========================\n`;
      content += `${t('exportCorrect')}${score}\n`;
      content += `${t('exportAcc')}${document.getElementById('finalAccuracy').textContent}\n\n`;
      
      content += `${t('mistakesLabel')}\n`;
      if (mistakeMap.size === 0) {
        content += `${t('exportNoMistakes')}\n`;
      } else {
        mistakeMap.forEach(w => {
          content += `- ${w.c} (${w.z}): ${w.e}\n`;
        });
      }
      
      content += `\n${t('slowestLabel')}\n`;
      let slowest3 = timeStats.sort((a, b) => b.time - a.time).slice(0, 3);
      if (slowest3.length === 0) {
        content += `${t('noRecord')}\n`;
      } else {
        slowest3.forEach((item, index) => {
          content += `${index + 1}. ${item.c} - ${(item.time / 1000).toFixed(1)} ${t('seconds')}\n`;
        });
      }
      
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `認字挑戰成績_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
